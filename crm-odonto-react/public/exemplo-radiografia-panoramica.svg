  <defs>
    <radialGradient id="fundo" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#20272e"/><stop offset="65%" stop-color="#12171c"/><stop offset="100%" stop-color="#080b0e"/>
    </radialGradient>
    <linearGradient id="osso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f6a5c" stop-opacity=".85"/><stop offset="100%" stop-color="#3c3931" stop-opacity=".6"/>
    </linearGradient>
    <filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer></filter>
    <filter id="suave"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="muitoSuave"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1040" height="560" fill="url(#fundo)"/>

